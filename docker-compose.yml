version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: n8n_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup_database.sql
    networks:
      - nails_network

  nails_app:
    build: .
    container_name: nails_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=disable
      - PORT=${PORT}
    depends_on:
      - postgres
    networks:
      - nails_network
    volumes:
      - ./public:/app/public

volumes:
  postgres_data:

networks:
  nails_network:
    driver: bridge
